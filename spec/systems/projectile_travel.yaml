name: ProjectileTravelSystem
description: |
  Стадия: Simulation

  Накапливает Projectile.traveled_distance по пути, который снаряд пройдёт за
  текущий тик, и уничтожает снаряд по достижении Projectile.max_distance.

  Пройденный за тик путь равен |Velocity| * effective_dt — той же величине,
  на которую снаряд смещает провайдер физики (effective_dt = dt * LocalTimeScale,
  если компонент есть). Система работает до стадии Physics, поэтому на тике
  превышения max_distance снаряд удаляется до интеграции.

  Раньше поле traveled_distance объявлялось как «накапливается», но ни одна
  система его не обновляла — снаряды не деспавнились по дистанции и летали вечно.

requires:
  - component: Projectile
    access: write
  - component: Velocity
    access: read
  - component: LocalTimeScale
    access: read
reads:
  - GameConfig
  - TimeState

logic: |
  # dt в секундах с учётом глобального замедления времени (см. conventions.md §4)
  dt = mul(div(GameConfig.ms_per_tick, 1000.0), TimeState.time_scale).

  Для каждой сущности из выборки, у которой есть Projectile и Velocity:

    # Локальное замедление снаряда (иммунитет к time slow и т.п.)
    effective_dt = dt.
    Если сущность имеет компонент LocalTimeScale:
      effective_dt = mul(dt, LocalTimeScale.scale).

    # Путь за тик = модуль скорости в XY * шаг времени
    speed = vec_length_xy((Velocity.dx, Velocity.dy, Velocity.dz)).
    step = mul(speed, effective_dt).
    Увеличить Projectile.traveled_distance на step.

    # Деспавн по достижении максимальной дистанции
    Если Projectile.traveled_distance >= Projectile.max_distance:
      Уничтожить сущность.
