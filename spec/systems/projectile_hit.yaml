name: ProjectileHitSystem
description: |
  Стадия: Reaction

  Обрабатывает коллизии снарядов (Collision события от физики).

  При попадании в щит (AttachedTo — стационарный барьер способности E):
  - Снаряд НЕ уничтожается и НЕ наносит урон через DamageCommand
  - Прочность щита уменьшается на Projectile.damage
  - Отскок снаряда обрабатывается физикой (Fireball.DynamicBody.restitution = 1.0)

  При попадании в цель с Health (персонаж):
  - Испускает DamageCommand
  - Уничтожает снаряд

  При попадании в стену: снаряд отскакивает (restitution=1.0 обрабатывается физикой).

requires:
  - component: Projectile
    access: read
  - component: Position
    access: read
  - component: Health
    access: write
  - component: AttachedTo
    access: read
triggers:
  - event: Collision
reads:
  - GameConfig
logic: |
  Для каждого события Collision:
    
    # Определить, какая сущность снаряд, а какая цель
    # entity_a < entity_b по контракту физики
    
    # Проверить, есть ли снаряд среди столкнувшихся сущностей
    projectile_id = 0.
    target_id = 0.
    
    # Проверить entity_a на Projectile
    Если сущность события.entity_a имеет компонент Projectile:
      projectile_id = события.entity_a.
      target_id = события.entity_b.
    # Проверить entity_b на Projectile
    Иначе, Если сущность события.entity_b имеет компонент Projectile:
      projectile_id = события.entity_b.
      target_id = события.entity_a.
    # Нет снаряда — игнорировать
    Иначе:
      Продолжить к следующей сущности.

    # Проверить, является ли цель щитом (стационарный барьер способности E)
    Если сущность target_id имеет компонент AttachedTo:
      # Щит блокирует и отражает снаряд — снаряд не уничтожается,
      # отскок отдаётся физике (restitution = 1.0 у Fireball)
      Прочитать Projectile.damage у projectile_id.
      Уменьшить Health.current у сущности target_id на Projectile.damage.
      Продолжить к следующей сущности.

    # Проверить, что цель имеет Health (значит это персонаж и т.д.)
    Если сущность target_id не имеет компонента Health:
      # Столкновение со стеной — снаряд отскакивает (физика обрабатывает)
      # Проверить максимальную дистанцию
      Прочитать Projectile.traveled_distance, Projectile.max_distance у projectile_id.
      Если Projectile.traveled_distance >= Projectile.max_distance:
        # Уничтожить снаряд по достижении макс. дистанции
        Уничтожить сущность projectile_id.
      Продолжить к следующей сущности.
    
    # Цель имеет Health — нанести урон
    Прочитать Projectile.damage, Projectile.owner_id у projectile_id.
    
    # Испустить команду урона
    Испустить событие DamageCommand с полями {
      target_id: target_id,
      source_id: Projectile.owner_id,
      damage: Projectile.damage,
      damage_type: "projectile"
    }.
    
    # Уничтожить снаряд (одноразовый)
    Уничтожить сущность projectile_id.
