name: DamageApplicationSystem
description: |
  Стадия: Resolution
  
  Применяет урон к цели из DamageCommand.
  Уменьшает Health цели, проверяет смерть (health <= 0).
  При смерти добавляет компонент Dead с respawn_tick.

requires:
  - component: Health
    access: write
  - component: Dead
    access: write
triggers:
  - event: DamageCommand
reads:
  - GameConfig
  - TimeState
logic: |
  Для каждого события DamageCommand:
    
    # Проверить, что цель существует
    Если сущность события.target_id не имеет компонента Health:
      Продолжить к следующей сущности.
    
    # Проверить, что цель ещё не мертва
    Если сущность события.target_id имеет компонент Dead:
      Продолжить к следующей сущности.
    
    # Применить урон
    Прочитать Health.current у сущности события.target_id.
    new_health = sub(Health.current, событие.damage).
    Установить Health.current у сущности события.target_id в new_health.
    
    # Проверить смерть
    Если new_health <= 0:
      # Сущность умирает
      Прочитать GameConfig.respawn_delay_ms, GameConfig.ms_per_tick.
      # Вычислить тик респавна
      respawn_ticks = div(GameConfig.respawn_delay_ms, GameConfig.ms_per_tick).
      respawn_tick = add(TimeState.current_tick, respawn_ticks).
      
      # Добавить компонент Dead
      Добавить компонент Dead к сущности события.target_id с полями {
        respawn_tick: respawn_tick
      }.
      
      # Остановить сущность
      Если сущность события.target_id имеет компонент Velocity:
        Установить Velocity.dx в 0.
        Установить Velocity.dy в 0.
        Установить Velocity.dz в 0.
