name: FireballCastSystem
description: |
  Стадия: Intent
  
  Обрабатывает каст фаербола (CastFireball).
  Проверяет кулдаун, создаёт сущность фаербола в направлении прицеливания.
  
  Направление полёта = normalize(target - caster_position).
  Начальная позиция = позиция кастера.

  Если кастер сейчас иммунен к замедлению времени (действует способность R),
  созданный фаербол наследует TimeSlowImmune и компенсирующий LocalTimeScale,
  чтобы лететь с нормальной скоростью, как и кастер (см. TimeSlowCastSystem).

requires:
  - component: Cooldowns
    access: write
  - component: Position
    access: read
  - component: TimeSlowImmune
    access: write
  - component: LocalTimeScale
    access: write
triggers:
  - event: CastFireball
reads:
  - GameConfig
  - TimeState
logic: |
  Для каждого события CastFireball:
    
    # Проверить, что кастер существует
    Если сущность события.caster_id не имеет компонента Cooldowns:
      Продолжить к следующей сущности.
    
    # Проверить кулдаун
    Прочитать Cooldowns.fireball у сущности события.caster_id.
    Если Cooldowns.fireball > 0:
      Продолжить к следующей сущности.
    
    # Проверить, что кастер не мёртв
    Если сущность события.caster_id имеет компонент Dead:
      Продолжить к следующей сущности.
    
    # Получить позицию кастера
    Прочитать Position.x, Position.y, Position.z у сущности события.caster_id.

    # Вычислить направление полёта
    delta = vec_sub((событие.target_x, событие.target_y, событие.target_z), (Position.x, Position.y, Position.z)).
    length_sq = vec_length_sq_xy(delta).

    Если length_sq == 0:
      # Цель совпадает с позицией — использовать направление по умолчанию
      dir = (1.0, 0, 0).
    Иначе:
      dir = vec_normalize_xy(delta).

    # Создать фаербол
    Прочитать GameConfig.fireball_speed, GameConfig.fireball_damage, GameConfig.fireball_max_distance.

    Создать сущность из архетипа Fireball с полями {
      Position: { x: Position.x, y: Position.y, z: Position.z },
      Velocity: {
        dx: mul(dir.x, GameConfig.fireball_speed),
        dy: mul(dir.y, GameConfig.fireball_speed),
        dz: mul(dir.z, GameConfig.fireball_speed)
      },
      Projectile: {
        owner_id: события.caster_id,
        damage: GameConfig.fireball_damage,
        max_distance: GameConfig.fireball_max_distance,
        traveled_distance: 0
      }
    }.

    # Если кастер сейчас иммунен к замедлению времени — снаряд наследует
    # иммунитет и компенсирующий локальный масштаб, иначе замедлится вместе с миром
    Если сущность события.caster_id имеет компонент TimeSlowImmune:
      Добавить компонент TimeSlowImmune к созданной сущности фаербола.
      Прочитать GameConfig.time_slow_scale.
      Установить LocalTimeScale.scale у созданной сущности фаербола
        в div(1.0, GameConfig.time_slow_scale).

    # Установить кулдаун
    Прочитать GameConfig.fireball_cooldown.
    Установить Cooldowns.fireball у сущности события.caster_id в GameConfig.fireball_cooldown.
