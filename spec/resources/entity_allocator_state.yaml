# Состояние аллокатора сущностей
# См. conventions.md §5 — идентификаторы сущностей

name: EntityAllocatorState
description: |
  Состояние аллокатора entity_id. Выдаёт уникальные идентификаторы
  монотонно возрастающим счётчиком.
  
  Инвариант: entity_id никогда не переиспользуются после уничтожения сущности.
  Это гарантирует, что ссылки по entity_id (например, Projectile.owner_id)
  не превратятся в ссылки на новую сущность после rollback.
  
  entity_id = 0 зарезервирован как «нет ссылки» (аналог null).

fields:
  next_id: u64    # Следующий доступный entity_id, начинается с 1
