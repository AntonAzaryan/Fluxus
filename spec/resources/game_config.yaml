# Глобальные параметры баланса игры
# Все числовые значения в fixed-point (Q32.16), но записываются как float для читаемости.
# Runtime конвертирует через to_fixed().

name: GameConfig
description: |
  Глобальные параметры баланса: скорости, урон, кулдауны, расстояния.
  Читается системами, не мутируется во время игры.

fields:
  # Персонаж
  player_move_speed: fixed       # 300.0 — скорость перемещения (единиц/сек)
  player_max_health: fixed       # 500.0 — максимальное здоровье
  player_radius: fixed           # 20.0 — радиус коллайдера персонажа

  # Фаербол (Q)
  fireball_speed: fixed          # 800.0 — скорость полёта (единиц/сек)
  fireball_max_distance: fixed   # 600.0 — максимальная дистанция полёта
  fireball_damage: fixed         # 100.0 — урон при попадании
  fireball_radius: fixed         # 8.0 — радиус коллайдера снаряда
  fireball_cooldown: fixed       # 100.0 — кулдаун в мс (низкий: несколько снарядов в полёте)

  # Щит (E)
  shield_spawn_distance: fixed   # 80.0 — расстояние от центра персонажа при создании
  shield_arc_degrees: fixed      # 30.0 — угол сектора защиты (градусы)
  shield_lifetime_ms: fixed      # 500.0 — время жизни в миллисекундах
  shield_health: fixed           # 1.0 — прочность щита (1 хит = уничтожен)
  shield_radius: fixed           # 35.0 — радиус коллайдера щита
  shield_cooldown: fixed         # 2000.0 — кулдаун в миллисекундах

  # Рывок (Space)
  dash_speed: fixed              # 1200.0 — скорость рывка (единиц/сек)
  dash_duration_ms: fixed        # 200.0 — длительность рывка в миллисекундах
  dash_cooldown_ms: fixed        # 500.0 — кулдаун рывка в миллисекундах

  # Замедление времени (R)
  time_slow_duration_ms: fixed   # 3000.0 — длительность эффекта в миллисекундах
  time_slow_cooldown_ms: fixed   # 15000.0 — кулдаун в миллисекундах
  time_slow_scale: fixed         # 0.5 — множитель времени (0.5 = 2x замедление)

  # Респавн
  respawn_delay_ms: fixed        # 10000.0 — задержка до возрождения в миллисекундах

  # Физика
  gravity: fixed                 # 0.0 — гравитация (в MVP 0, летает по горизонтали)

  # Время
  ms_per_tick: fixed             # 16.666667 — мс на тик при meta.tick_rate=60.
                                  # Единственный источник конвертации мс↔тик:
                                  # все системы обязаны читать это поле,
                                  # а не хардкодить 1000.0/tick_rate самостоятельно.
