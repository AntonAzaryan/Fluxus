# Архетип стены
# Статичное препятствие на карте

name: Wall
description: |
  Архетип стены — статичное препятствие, не двигается.
  Используется для создания уровня (стены, укрытия).
  
  Компоненты:
  - Position, Collider, StaticBody — статичное физическое тело
  - CollisionLayer — слой стен

components:
  Position:
    x: 0
    y: 0
    z: 0
  Collider:
    shape: aabb
    radius: 0
    half_width: 50.0  # половина ширины, настраивается при создании
    half_height: 50.0 # половина высоты, настраивается при создании
    height: 100.0     # высота по Z
  StaticBody: {}
  CollisionLayer:
    layer: 2          # слой 2 = стены
    mask: 0b1111      # сталкивается со всем (игроки, стены, щиты, снаряды)
