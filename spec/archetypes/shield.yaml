# Архетип щита
# Барьер способности E (Shield)

name: Shield
description: |
  Архетип щита — временный барьер, создаётся перед персонажем.
  Щит — отдельная сущность с коллайдером, блокирует снаряды.
  
  Компоненты:
  - Position, Collider, StaticBody — статичный барьер
  - Health — здоровье щита (1 хит = уничтожен)
  - AttachedTo — ссылка на владельца
  - Lifetime — тик истечения (заполняется ShieldCastSystem при создании)
  - CollisionLayer — слой щитов

  Время жизни: shield_lifetime_ms (500 мс), после чего удаляется
  ShieldExpirationSystem по Lifetime.expires_tick.

components:
  Position:
    x: 0
    y: 0
    z: 0
  Collider:
    shape: circle
    radius: 35.0      # из GameConfig.shield_radius
    half_width: 0
    half_height: 0
    height: 50.0
  StaticBody: {}
  Health:
    current: 1.0      # из GameConfig.shield_health
    max: 1.0
  AttachedTo:
    owner_id: 0       # заполняется при создании
  Lifetime:
    expires_tick: 0   # заполняется ShieldCastSystem при создании
  CollisionLayer:
    layer: 4          # слой 4 = щиты
    mask: 0b1010      # сталкивается со стенами (2) и снарядами (8), не с игроками
