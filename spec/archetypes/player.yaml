# Архетип игрока
# Базовый шаблон для создания сущности персонажа

name: Player
description: |
  Архетип игрока — управляемый персонаж с полным набором способностей.
  Используется при спавне нового игрока в игру.
  
  Компоненты:
  - Position, Velocity, Collider, DynamicBody — физическое тело
  - Health — здоровье
  - Cooldowns — кулдауны способностей
  - MoveIntent — намерение движения (заполняется каждый тик)
  - CollisionLayer — слой коллизий (игрок не сталкивается с союзниками)

components:
  Position:
    x: 0
    y: 0
    z: 0
  Velocity:
    dx: 0
    dy: 0
    dz: 0
  Collider:
    shape: circle
    radius: 20.0      # из GameConfig.player_radius
    half_width: 0
    half_height: 0
    height: 30.0      # высота по Z
  DynamicBody:
    mass: 1.0
    restitution: 0.0   # нет отскока
    friction: 0.8      # высокое трение для остановки
  Health:
    current: 500.0    # из GameConfig.player_max_health
    max: 500.0
  Cooldowns:
    fireball: 0       # готовы сразу
    shield: 0
    dash: 0
    time_slow: 0
  MoveIntent:
    dx: 0
    dy: 0
    dz: 0
  CollisionLayer:
    layer: 1          # слой 1 = игроки
    mask: 0b111       # сталкивается со стенами (2), щитами (4), снарядами (8)
