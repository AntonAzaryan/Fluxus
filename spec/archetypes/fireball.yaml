# Архетип фаербола
# Снаряд способности Q (Fireball)

name: Fireball
description: |
  Архетип снаряда фаербола. Создаётся FireballCastSystem при касте способности Q.
  Летит по прямой в направлении прицеливания, наносит урон при попадании.
  
  Компоненты:
  - Position, Velocity, Collider, DynamicBody — физическое тело
  - Projectile — маркер снаряда с информацией о владельце
  - LocalTimeScale — для иммунитета к замедлению времени
  - CollisionLayer — слой снарядов

components:
  Position:
    x: 0
    y: 0
    z: 0
  Velocity:
    dx: 0
    dy: 0
    dz: 0
  Collider:
    shape: circle
    radius: 8.0       # из GameConfig.fireball_radius
    half_width: 0
    half_height: 0
    height: 10.0
  DynamicBody:
    mass: 0.1         # лёгкий снаряд
    restitution: 1.0  # полный отскок от стен
    friction: 0.0     # нет трения
  Projectile:
    owner_id: 0       # заполняется при создании
    damage: 100.0     # из GameConfig.fireball_damage
    max_distance: 600.0  # из GameConfig.fireball_max_distance
    traveled_distance: 0
  LocalTimeScale:
    scale: 1.0        # по умолчанию, меняется при замедлении времени
  CollisionLayer:
    layer: 8          # слой 8 = снаряды
    mask: 0b111       # сталкивается с игроками (1), стенами (2), щитами (4)
