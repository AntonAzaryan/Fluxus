# Динамическое физическое тело
# См. physics_v1.md §2 — обязательные компоненты для динамического тела

name: DynamicBody
description: |
  Маркер динамического физического тела. В сочетании с Position, Velocity, Collider
  делает сущность полноценным физическим объектом, подверженным коллизиям.
  
  Провайдер физики читает DynamicBody и применяет физику к сущности.

fields:
  mass: fixed       # Масса тела (для коллизий и импульсов)
  restitution: fixed # Коэффициент упругости (0 = нет отскока, 1 = идеальный отскок)
  friction: fixed    # Коэффициент трения (0 = скользкое, 1 = высокое трение)
