# Привязка сущности к владельцу
# Используется для щита, который следует за персонажем

name: AttachedTo
description: |
  Связывает сущность с владельцем (родителем).
  Используется для щита, который следует за персонажем.

  Система ShieldCastSystem создаёт щит с AttachedTo = { owner_id: player_id,
  offset_x, offset_y }, где offset — вектор от владельца до щита в момент
  каста (задаёт и позицию, и направление, в которое повёрнут щит).

  Каждый тик AttachedToSyncSystem (стадия Simulation) удерживает
  Position сущности равной Position владельца + offset, так что щит
  следует за владельцем на исходном смещении/направлении каста.

fields:
  owner_id: u64    # entity_id владельца (0 если нет владельца)
  offset_x: fixed  # смещение по X от владельца, зафиксированное при каста
  offset_y: fixed  # смещение по Y от владельца, зафиксированное при каста
