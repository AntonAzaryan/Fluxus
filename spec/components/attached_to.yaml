# Привязка сущности к владельцу
# Используется для щита, который следует за персонажем

name: AttachedTo
description: |
  Связывает сущность с владельцем (родителем).
  Используется для щита, который следует за персонажем.
  
  Система ShieldCastSystem создаёт щит с AttachedTo = player_id.
  Щит позиционируется относительно владельца при создании,
  но в MVP не обновляет позицию каждый тик (стационарен после каста).

fields:
  owner_id: u64    # entity_id владельца (0 если нет владельца)
