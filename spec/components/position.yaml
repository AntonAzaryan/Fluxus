# Позиция сущности в мире
# См. conventions.md §2 — fixed-point арифметика, glossary.md — Position

name: Position
description: |
  Координаты сущности в мире 2.5D: XY — плоскость коллизий, Z — высота как скаляр.
  Изменяется только провайдером физики в стадии Physics (см. physics_v1.md §4).
  Системы читают Position, но влияют на движение через Velocity/MoveIntent.

fields:
  x: fixed    # X-координата в fixed-point
  y: fixed    # Y-координата в fixed-point
  z: fixed    # Z-координата (высота), обычно 0 для наземных сущностей
