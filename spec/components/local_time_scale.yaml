# Локальный масштаб времени
# См. conventions.md §4 — локальное замедление для сущности

name: LocalTimeScale
description: |
  Локальный множитель времени для сущности.
  Эффективный dt для сущности = mul(global_dt, local_scale).
  
  Используется для игнорирования глобального замедления времени:
  - Кастер замедления времени и его снаряды получают local_scale = 1.0 / time_slow_scale
  - Это компенсирует глобальное time_scale, позволяя двигаться с нормальной скоростью

fields:
  scale: fixed    # Локальный множитель (1.0 = норма, 2.0 = 2x быстрее относительно мира)
