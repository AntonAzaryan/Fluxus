# Кулдауны способностей
# См. schedule.yaml — CooldownTickSystem

name: Cooldowns
description: |
  Кулдауны способностей персонажа. Хранят оставшееся время до доступности.
  CooldownTickSystem уменьшает значения на 1 каждый тик (до 0).
  При смерти персонажа (респауне) все кулдауны сбрасываются в 0.
  
  Время хранится в миллисекундах как fixed-point.

fields:
  fireball: fixed     # Кулдаун фаербола (Q), мс
  shield: fixed       # Кулдаун щита (E), мс
  dash: fixed         # Кулдаун рывка (Space), мс
  time_slow: fixed    # Кулдаун замедления времени (R), мс
