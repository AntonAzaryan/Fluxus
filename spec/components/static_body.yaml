# Статичное физическое тело
# См. physics_v1.md §2 — обязательные компоненты для статичного тела

name: StaticBody
description: |
  Маркер статичного физического тела (стены, декорации).
  Сущность с StaticBody не двигается провайдером физики, но участвует в коллизиях.
  
  Статичное тело должно иметь Position и Collider, но не требует Velocity или DynamicBody.

fields: {}
