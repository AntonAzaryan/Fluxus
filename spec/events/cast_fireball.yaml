# Команда каста фаербола
# Генерируется PlayerCommandIngestSystem, потребляется FireballCastSystem

name: CastFireball
description: |
  Команда каста способности «Фаербол» (клавиша Q).
  Генерируется PlayerCommandIngestSystem из InputBuffer.
  
  FireballCastSystem читает CastFireball, проверяет кулдаун,
  создаёт сущность фаербола и устанавливает кулдаун.
  
  Прицеливание: target_x, target_y — мировые координаты точки клика мыши.
  Направление полёта = normalize(vec_sub(target, position_caster)).

fields:
  tick: u64           # Тик отправки команды (для валидации)
  player_id: u64      # entity_id игрока
  caster_id: u64      # entity_id кастера (обычно = player_id)
  target_x: fixed     # Мировая X координата точки прицеливания
  target_y: fixed     # Мировая Y координата точки прицеливания
  target_z: fixed     # Мировая Z координата точки прицеливания
