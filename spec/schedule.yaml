schedule:
  - stage: Input
    systems:
      - PlayerCommandIngestSystem

  - stage: Intent
    systems:
      - CooldownTickSystem
      - MoveIntentSystem
      - DashStartSystem
      - FireballCastSystem
      - ShieldCastSystem

  - stage: Simulation
    description: |
      Формирование Velocity. Position не мутируется.
      Гравитация применяется к dz здесь.
    systems:
      - DashUpdateSystem
      - SprintSystem
      - FrictionSystem
      - GravitySystem

  - stage: Physics
    provider: external
    contract: PhysicsContractV1
    description: |
      Внешний провайдер. Читает Position, Velocity, Collider.
      Пишет Position (единственная стадия, где это разрешено).
      Порождает события Collision, RaycastHit.

  - stage: Reaction
    description: |
      Реакция на физические события: отскоки снарядов, попадания.
    systems:
      - ProjectileBounceSystem
      - ProjectileHitSystem

  - stage: Resolution
    systems:
      - DamageApplicationSystem
      - ShieldExpirationSystem
      - DespawnSystem

  - stage: Time
    systems:
      - TimeAdvanceSystem