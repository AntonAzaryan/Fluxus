<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>render-ts демо — террейн, герой, фаербол</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
      }
      /* Контейнер вьюпорта — опора оверлея HUD (host.ts: absolute, inset 0). */
      #app {
        position: relative;
      }
      #app,
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Минимальная нейтральная стилизация виджетов HUD (design, Non-Goals):
         раскладку зон и прохождение указателя задаёт сам оверлей-хост
         инлайн-стилями, здесь — только внешний вид демо. */
      [data-hud-root] {
        font: 13px/1.5 ui-monospace, Menlo, monospace;
        color: #e8e8f0;
        user-select: none;
      }
      .hud-match-status {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 12px;
        padding: 8px 12px;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
      }
      .hud-match-status__tick::before {
        content: 'тик ';
        opacity: 0.6;
      }
      .hud-match-status.is-paused {
        border-color: #ffd479;
      }
      .hud-match-status.is-paused .hud-match-status__mode {
        color: #ffd479;
      }
      .hud-match-status__pause,
      .hud-cooldowns__button {
        font: inherit;
        color: inherit;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 6px;
        cursor: pointer;
      }
      .hud-match-status__pause:active,
      .hud-cooldowns__button:active {
        border-color: #ffd479;
      }
      /* Оверлей паузы матча (HUD-9): плашка в центре вьюпорта. Показывается и
         прячется САМ виджет (inline `display`) по доставленному состоянию —
         здесь только вид. Жёлтый тот же, что у паузы статуса матча: это одно и
         то же событие, названное двумя виджетами. */
      .hud-pause {
        margin: 12px;
        padding: 14px 22px;
        text-align: center;
        background: rgba(10, 10, 24, 0.82);
        border: 1px solid rgba(255, 212, 121, 0.5);
        border-radius: 10px;
      }
      .hud-pause__title {
        font-size: 20px;
        letter-spacing: 0.08em;
        color: #ffd479;
      }
      .hud-pause__by {
        margin-top: 4px;
        opacity: 0.75;
      }
      .hud-pause__countdown {
        margin-top: 8px;
        font-size: 16px;
        color: #ffd479;
      }
      /* Отказ политики показывается и БЕЗ заморозки — тогда плашка состоит из
         одной этой строки (HUD-9, сценарий «Отказ в паузе»). */
      .hud-pause__denied {
        margin-top: 4px;
        color: #ff9f9f;
      }
      /* Панель способностей: сетка в два ряда — число колонок ставит виджет
         инлайн-стилем по параметру композиции (HUD-4). Нижний отступ меньше
         бокового: полоса прижата к краю экрана, центрирует её сетка зон
         оверлея (host.ts), а не эти поля. */
      .hud-cooldowns {
        display: grid;
        gap: 8px;
        margin: 12px 12px 4px;
      }
      .hud-cooldowns__button {
        position: relative;
        width: 52px;
        height: 52px;
        padding: 8px;
        border-radius: 10px;
        overflow: hidden;
      }
      .hud-cooldowns__icon {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Кнопка формы «удержание» (HUD-2): её держат, а не кликают. Форму
         объявляет композиция (`hold: true` записи способности), стиль только
         показывает её игроку — иначе кнопка вела бы себя иначе молча. */
      .hud-cooldowns__button[data-form='hold'] {
        box-shadow: inset 0 0 0 2px rgba(255, 212, 121, 0.5);
      }
      /* Иконка приезжает сервисом ассетов (HUD-4): пока не приехала — прячем
         альтернативный текст, а не приехала совсем — красная рамка, чтобы
         дефект дерева контента был виден, а не выглядел пустой кнопкой. */
      .hud-cooldowns__button[data-icon='loading'] .hud-cooldowns__icon {
        visibility: hidden;
      }
      .hud-cooldowns__button[data-icon='failed'] {
        box-shadow: inset 0 0 0 2px rgba(255, 96, 96, 0.7);
      }
      /* Оверлей кулдауна в стиле доты: затемнение по доле из CSS-переменной,
         которую виджет пишет из доставленных статов (HUD-8). */
      .hud-cooldowns__overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: conic-gradient(
          rgba(6, 8, 16, 0.72) calc(var(--cooldown, 0) * 360deg),
          transparent 0
        );
      }
      .hud-cooldowns__seconds {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font: 600 16px/1 ui-monospace, Menlo, monospace;
        color: #ffd479;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      /* Полоса здоровья под портретом (HUD-8). */
      .hud-hp-bar {
        position: relative;
        width: 122px;
        height: 14px;
        margin: 0 12px 12px;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        overflow: hidden;
      }
      .hud-hp-bar__fill {
        height: 100%;
        background: linear-gradient(90deg, #d0453c, #7ec96a);
      }
      .hud-hp-bar__text {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font: 11px/1 ui-monospace, Menlo, monospace;
      }
      .hud-hp-bar.is-empty .hud-hp-bar__text {
        opacity: 0.5;
      }
      /* Счётчики смертей сверху по центру. */
      .hud-deaths__rows {
        display: flex;
        gap: 10px;
        margin: 12px;
      }
      .hud-deaths__row {
        min-width: 34px;
        padding: 4px 8px;
        text-align: center;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
      }
      .hud-deaths__row::before {
        content: 'слот ' attr(data-slot) ': ';
        opacity: 0.6;
      }
      /* Рантайм-панель слева сверху: кадры, тик, сущности. */
      .hud-runtime {
        display: flex;
        gap: 10px;
        margin: 0 12px 12px;
        padding: 6px 10px;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
      }
      .hud-runtime__fps::after {
        content: ' fps';
        opacity: 0.6;
      }
      .hud-runtime__tick::before {
        content: 'тик ';
        opacity: 0.6;
      }
      .hud-runtime__entities::after {
        content: ' сущн.';
        opacity: 0.6;
      }
      .hud-minimap {
        margin: 12px;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        overflow: hidden;
      }
      .hud-portrait {
        margin: 12px;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        overflow: hidden;
      }
      .hud-portrait--dead {
        filter: grayscale(1);
      }
      .hud-portrait--hit {
        border-color: #ff5a4a;
      }
      .hud-portrait--empty {
        opacity: 0.6;
      }
      /* Кнопка подключения к стенду (design D4): DOM демо-приложения, а не
         виджет HUD — это переход между режимами страницы, то есть новый старт
         оболочки (SHELL-8), а не действие внутри матча. */
      #connect {
        position: fixed;
        right: 12px;
        bottom: 12px;
        padding: 6px 10px;
        color: #e8e8f0;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        text-decoration: none;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        z-index: 20;
      }
      #connect:hover {
        border-color: #ffd479;
      }
      /* Переключатель качества картинки (`render-quality` QUAL-1, design D4):
         такой же DOM демо-приложения, как кнопка режима, — это настройка
         страницы, а не действие внутри матча. Список наполняет main.ts из
         набора пресетов игры: четвёртый уровень качества разметки не касается. */
      #quality {
        position: fixed;
        right: 12px;
        bottom: 48px;
        padding: 6px 10px;
        color: #e8e8f0;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        z-index: 20;
      }
      #quality:hover {
        border-color: #ffd479;
      }
      /* Панель отладочных источников (`render-debug` RDBG-1, design D10):
         такая же настройка страницы, как выбор качества рядом, а не виджет HUD.
         Список строится main.ts из реестра слоя — разметка о составе источников
         не знает, и новый источник появляется в панели сам.

         Свёрнута по умолчанию: отладка — редкий режим, а не постоянный элемент
         экрана. Спойлер живёт ЦЕЛИКОМ в разметке: `createDebugPanel` дополняет
         существующий контейнер (`container.append(list, text)` — после
         `<summary>`) и о `details` ничего не знает, поэтому раскрытие ничего не
         стоит коду панели.

         Обшивка (фон, рамка, поля, ограничение размера) снята с самого блока и
         роздана двум состояниям: закрытый спойлер — ОДНА коробка, которую
         рисует `summary` по рецепту соседнего выбора качества, открытый —
         коробка панели, внутри которой `summary` становится строкой-заголовком.
         Коробки в коробке нет ни в одном из состояний. */
      #debug {
        position: fixed;
        right: 12px;
        bottom: 88px;
        color: #e8e8f0;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        z-index: 20;
      }
      /* Закрытое состояние — ровно тот же рецепт, что у `#quality` рядом:
         одинаковый шрифт, поля, фон, рамка и радиус, то есть один и тот же
         класс виджета в стопке у правого края. */
      #debug > summary {
        padding: 6px 10px;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        list-style: none;
        cursor: pointer;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
      }
      /* Штатный треугольник раскрытия сломал бы это равенство размеров. */
      #debug > summary::-webkit-details-marker {
        display: none;
      }
      /* Открытое состояние: панель растёт ВВЕРХ от `bottom: 88px` — привязан
         только нижний край, поэтому выбор качества и кнопка режима под ней не
         перекрываются. */
      #debug[open] {
        max-width: 46ch;
        max-height: 60vh;
        overflow: auto;
        padding: 8px 10px;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
      }
      #debug[open] > summary {
        margin: 0 0 8px;
        padding: 0 0 6px;
        background: none;
        border: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 0;
      }
      /* После правил состояний: специфичность у них равная, и порядок отдаёт
         подсветку наведению — закрытая коробка светится рамкой, открытая
         подчёркиванием заголовка. */
      #debug > summary:hover {
        border-color: #ffd479;
      }
      .debug-panel__owner {
        margin: 6px 0 2px;
        opacity: 0.6;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      #debug label {
        display: flex;
        gap: 6px;
        align-items: center;
        cursor: pointer;
      }
      /* Текстовая часть инспектора и счётчиков — из дампа кадра (RDBG-3, RDBG-7):
         в пакете рендера DOM не появляется, текст живёт здесь. */
      .debug-panel__text {
        margin: 8px 0 0;
        max-height: 24vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        opacity: 0.85;
      }
      .debug-panel__text:empty {
        display: none;
      }
      /* Адаптивный запас разметки ввода в тиках (`netcode-transport` NTR-7):
         счётчик клиента `inputLead` (NTR-11), приезжающий из воркера сетевого
         режима. Такое же показание страницы, как выбор качества и панель
         отладки, — в композицию HUD оно не входит: это не действие внутри
         матча. Правый ВЕРХ, а не правый низ: снизу стопка страницы, и открытая
         панель отладки растёт вверх поверх неё. Скрыто, пока матча нет: в
         соло-режиме сервера не существует, и величины тоже. */
      #lead {
        display: none;
        position: fixed;
        right: 12px;
        top: 12px;
        padding: 6px 10px;
        color: #e8e8f0;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        z-index: 20;
      }
      /* Сплеш старта (`game-boot` BOOT-2): непрозрачный слой поверх вьюпорта,
         присутствующий в разметке ДО исполнения скриптов приложения — первый
         кадр, который видит игрок, несёт его, а не фон страницы и не пустой
         канвас. Скрипт его ВЕДЁТ (`app/boot/splash.ts`), а не создаёт.

         z-index 15 — ниже органов страницы (20) и сообщений сборки (30), выше
         `#app` и HUD внутри него: сцена под сплешем не видна, а дорога со
         сломанной страницы — кнопка режима и `#notice` — видна (BOOT-2).

         Состояние ведёт атрибут `data-state`: `done` убирает слой из потока
         событий и отрисовки целиком, а не оставляет прозрачным поверх кадра. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 15;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 14px;
        padding: 24px;
        color: #e8e8f0;
        font: 14px/1.6 ui-monospace, Menlo, monospace;
        text-align: center;
        background: #12121f;
        opacity: 1;
        transition: opacity var(--boot-fade, 400ms) ease-out;
      }
      #boot[data-state='revealing'] {
        opacity: 0;
      }
      #boot[data-state='done'] {
        display: none;
      }
      .boot__title {
        font-size: 22px;
        letter-spacing: 0.12em;
      }
      .boot__status {
        min-height: 1.6em;
        opacity: 0.75;
      }
      /* Полоса прогресса стадий: долю ставит адаптер переменной, а не шириной
         в пикселях — раскладку держит разметка. */
      .boot__progress {
        width: min(320px, 60vw);
        height: 3px;
        background: rgba(255, 255, 255, 0.14);
        border-radius: 2px;
        overflow: hidden;
      }
      .boot__bar {
        width: calc(var(--boot-progress, 0) * 100%);
        height: 100%;
        background: #ffd479;
        transition: width 120ms linear;
      }
      /* Слот медиа (BOOT-2): пуст при `kind: none`, и тогда сплеш — оформление
         разметки с заголовком. Своей графики у демо пока нет. */
      .boot__media:empty {
        display: none;
      }
      .boot__media img,
      .boot__media video {
        max-width: min(720px, 80vw);
        max-height: 50vh;
      }
      /* Сообщение сборки: матч занят, стенд не отвечает. Скрыто, пока нечего
         сказать; текст ставит main.ts. */
      #notice {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        max-width: 60ch;
        transform: translate(-50%, -50%);
        padding: 14px 18px;
        color: #ffd479;
        font: 13px/1.6 ui-monospace, Menlo, monospace;
        text-align: center;
        background: rgba(10, 10, 24, 0.9);
        border: 1px solid #ffd479;
        border-radius: 10px;
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" data-state="splash">
      <div class="boot__media"></div>
      <div class="boot__title">Fluxus — демо-арена</div>
      <div class="boot__status">загрузка…</div>
      <div class="boot__progress"><div class="boot__bar"></div></div>
    </div>
    <div id="notice"></div>
    <details id="debug" title="отладочные источники рендера (render-debug)">
      <summary>отладка</summary>
    </details>
    <div id="lead" title="запас разметки ввода в тиках (netcode-transport NTR-7)"></div>
    <select id="quality" title="качество картинки"></select>
    <a id="connect" href="#">играть по сети →</a>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
