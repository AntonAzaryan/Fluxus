name: DespawnSystem
description: |
  Стадия: Resolution
  
  Обрабатывает респавн мёртвых сущностей.
  Когда current_tick >= Dead.respawn_tick:
  - Удаляет компонент Dead
  - Восстанавливает Health.current = Health.max
  - Сбрасывает все Cooldowns в 0
  - Восстанавливает позицию (в MVP: остаётся на месте)

requires:
  - component: Dead
    access: write
  - component: Health
    access: write
  - component: Cooldowns
    access: write
  - component: Position
    access: read
  - component: Velocity
    access: write
reads:
  - TimeState
logic: |
  Для каждой сущности из выборки, у которой есть Dead:
    
    # Проверить, наступил ли тик респавна
    Если TimeState.current_tick < Dead.respawn_tick:
      Продолжить к следующей сущности.
    
    # Респавн!
    
    # Удалить компонент Dead
    Удалить компонент Dead у сущности.
    
    # Восстановить здоровье
    Установить Health.current в Health.max.
    
    # Сбросить кулдауны
    Если сущность имеет компонент Cooldowns:
      Установить Cooldowns.fireball в 0.
      Установить Cooldowns.shield в 0.
      Установить Cooldowns.dash в 0.
      Установить Cooldowns.time_slow в 0.
    
    # Остановить сущность (на случай если двигалась)
    Если сущность имеет компонент Velocity:
      Установить Velocity.dx в 0.
      Установить Velocity.dy в 0.
      Установить Velocity.dz в 0.
    
    # Позиция остаётся той же (респавн на месте смерти)
    # В полной версии: телепортация на точку спавна
