name: ShieldExpirationSystem
description: |
  Стадия: Resolution

  Проверяет время жизни щитов и удаляет истёкшие.
  Щит живёт shield_lifetime_ms (500 мс) после создания
  (Lifetime.expires_tick, устанавливается ShieldCastSystem).

  Также удаляет щит при потере прочности (Health.current <= 0).

requires:
  - component: Health
    access: read
  - component: AttachedTo
    access: read
  - component: Lifetime
    access: read
reads:
  - TimeState
logic: |
  # Удалить щиты, у которых здоровье <= 0
  Для каждой сущности из выборки, у которой есть Health, AttachedTo:
    Если Health.current <= 0:
      Уничтожить сущность.

  # Удалить щиты, у которых истекло время жизни
  Для каждой сущности из выборки, у которой есть Lifetime, AttachedTo:
    Если Lifetime.expires_tick != 0 и TimeState.current_tick >= Lifetime.expires_tick:
      Уничтожить сущность.
