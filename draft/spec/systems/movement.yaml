name: MovementSystem
description: |
  Стадия: Simulation
  
  Конвертирует MoveIntent в целевую скорость и подводит к ней Velocity
  с ограниченным шагом: разгон при нажатых клавишах (GameConfig.player_accel),
  торможение при отпущенных (GameConfig.player_decel).
  Учитывает компонент Dash — если есть активный рывок, движение игнорируется.

  Максимальная скорость берётся из GameConfig.player_move_speed.

requires:
  - component: Position
    access: read
  - component: Velocity
    access: write
  - component: MoveIntent
    access: read
  - component: Dash
    access: read
  - component: LocalTimeScale
    access: read
reads:
  - GameConfig

logic: |
  Для каждой сущности из выборки, у которой есть Position, Velocity, MoveIntent:
    
    # Если есть активный рывок — пропустить (DashUpdateSystem управляет скоростью)
    Если сущность имеет компонент Dash:
      Продолжить к следующей сущности.
    
    # Если игрок мёртв — не двигаться
    Если сущность имеет компонент Dead:
      Продолжить к следующей сущности.
    
    Прочитать MoveIntent.dx, MoveIntent.dy, MoveIntent.dz.

    # Целевая скорость
    Прочитать GameConfig.player_move_speed.

    moving = (MoveIntent.dx != 0 или MoveIntent.dy != 0 или MoveIntent.dz != 0).

    Если moving:
      # Вычислить длину вектора в плоскости XY
      length_sq = vec_length_sq_xy((MoveIntent.dx, MoveIntent.dy, MoveIntent.dz)).

      Если length_sq > 1.0:
        normalized = vec_normalize_xy((MoveIntent.dx, MoveIntent.dy, MoveIntent.dz)).
      Иначе:
        normalized = (MoveIntent.dx, MoveIntent.dy, MoveIntent.dz).

      target = vec_scale(normalized, GameConfig.player_move_speed).
    Иначе:
      target = (0, 0, 0).

    # Ограниченный шаг к целевой скорости: разгон / торможение.
    # effective_dt масштабируется LocalTimeScale ровно так же, как в
    # физическом провайдере (contracts/physics_v1.md) — иначе при замедлении
    # времени разгон занимал бы столько же тиков на укороченном пути.
    effective_dt = dt.
    Если сущность имеет компонент LocalTimeScale:
      effective_dt = mul(dt, LocalTimeScale.scale).

    Если moving:
      max_delta = mul(GameConfig.player_accel, effective_dt).
    Иначе:
      max_delta = mul(GameConfig.player_decel, effective_dt).

    # Шаг считается по ВЕКТОРУ разницы, не покомпонентно: покомпонентное
    # ограничение разгоняло бы диагональ в sqrt(2) раза быстрее прямой.
    delta = vec_sub(target, (Velocity.dx, Velocity.dy, Velocity.dz)).
    dist = vec_length_xy(delta).

    Если dist <= max_delta:
      # Дошли за этот тик — сесть точно на target, иначе останется
      # бесконечное подползание на остаточных квантах скорости.
      Установить Velocity.dx в target.x.
      Установить Velocity.dy в target.y.
    Иначе:
      step = vec_scale(vec_normalize_xy(delta), max_delta).
      Установить Velocity.dx в add(Velocity.dx, step.x).
      Установить Velocity.dy в add(Velocity.dy, step.y).

    # MVP: арена плоская, вертикальная скорость не разгоняется.
    Установить Velocity.dz в target.z.
