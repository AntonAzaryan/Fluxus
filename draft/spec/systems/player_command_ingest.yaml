name: PlayerCommandIngestSystem
description: |
  Стадия: Input
  
  Читает сырые команды из InputBuffer (внешний слой) и конвертирует их
  в события-команды для систем способностей.
  
  Валидация:
  - Проверяет существование сущности игрока
  - Проверяет, что игрок не мёртв (нет компонента Dead)
  - Не проверяет кулдауны (это делают системы каста)

requires:
  - component: Health
    access: read
reads:
  - InputBuffer
  - TimeState
triggers:
  - event: MoveCommand
  - event: CastFireball
  - event: CastShield
  - event: DashCommand
  - event: CastTimeSlow

logic: |
  Прочитать InputBuffer.commands.
  
  Для каждой команды в InputBuffer.commands:
    
    # Обработка MoveCommandInput
    Если команда.type == "MoveCommandInput":
      Прочитать Health у сущности команда.player_id.
      Если Health существует и сущность не имеет компонента Dead:
        Испустить событие MoveCommand с полями {
          tick: TimeState.current_tick,
          player_id: команда.player_id,
          dx: команда.dx,
          dy: команда.dy,
          dz: команда.dz
        }.
    
    # Обработка CastFireballInput
    Если команда.type == "CastFireballInput":
      Прочитать Health у сущности команда.player_id.
      Если Health существует и сущность не имеет компонента Dead:
        Испустить событие CastFireball с полями {
          tick: TimeState.current_tick,
          player_id: команда.player_id,
          caster_id: команда.player_id,
          target_x: команда.target_x,
          target_y: команда.target_y,
          target_z: команда.target_z
        }.
    
    # Обработка CastShieldInput
    Если команда.type == "CastShieldInput":
      Прочитать Health у сущности команда.player_id.
      Если Health существует и сущность не имеет компонента Dead:
        Испустить событие CastShield с полями {
          tick: TimeState.current_tick,
          player_id: команда.player_id,
          caster_id: команда.player_id,
          target_x: команда.target_x,
          target_y: команда.target_y,
          target_z: команда.target_z
        }.
    
    # Обработка DashInput
    Если команда.type == "DashInput":
      Прочитать Health у сущности команда.player_id.
      Если Health существует и сущность не имеет компонента Dead:
        Испустить событие DashCommand с полями {
          tick: TimeState.current_tick,
          player_id: команда.player_id
        }.
    
    # Обработка CastTimeSlowInput
    Если команда.type == "CastTimeSlowInput":
      Прочитать Health у сущности команда.player_id.
      Если Health существует и сущность не имеет компонента Dead:
        Испустить событие CastTimeSlow с полями {
          tick: TimeState.current_tick,
          player_id: команда.player_id,
          caster_id: команда.player_id
        }.
  
  # Очистить буфер после обработки
  Установить InputBuffer.commands в пустой список.
