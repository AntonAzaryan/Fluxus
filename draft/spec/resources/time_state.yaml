# Состояние времени симуляции
# См. conventions.md §4

name: TimeState
description: |
  Глобальное состояние времени симуляции.
  current_tick — номер текущего тика (монотонно растёт).
  time_scale — множитель скорости (1.0 = норма, 0.5 = slow-mo, 0 = пауза).
  
  Шаг времени вычисляется как: dt = mul(div(1.0, tick_rate), time_scale)
  где tick_rate берётся из meta (например, 60 тиков/сек).

fields:
  current_tick: u64     # Номер текущего тика, начинается с 0
  time_scale: fixed     # Глобальный множитель времени, 1.0 = норма
