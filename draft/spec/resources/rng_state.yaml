# Состояние генератора псевдослучайных чисел
# См. conventions.md §3 — PCG32 (pcg-xsh-rr, 64→32)

name: RngState
description: |
  Состояние PCG32 RNG. Используется для всех случайных операций в симуляции.
  Инициализируется через pcg32_srandom(seed, seq) при старте игры.
  
  Все операции над state/inc — wrapping u64 (единственное место, где wrapping разрешён).

fields:
  state: u64    # Текущее состояние генератора
  inc: u64      # Инкремент (stream), определяет независимую последовательность
