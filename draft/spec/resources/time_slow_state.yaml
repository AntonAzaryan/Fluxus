# Состояние эффекта глобального замедления времени (способность R)
# См. schedule.yaml — TimeSlowCastSystem, TimeSlowSyncSystem

name: TimeSlowState
description: |
  Отслеживает активный эффект глобального замедления времени.

  expires_tick == 0 означает, что эффект сейчас не активен (по аналогии
  с entity_id == 0 как «нет ссылки», см. glossary.md).

  TimeSlowCastSystem устанавливает expires_tick при касте способности.
  TimeSlowSyncSystem каждый тик проверяет TimeState.current_tick
  относительно expires_tick и по достижении сбрасывает эффект:
  TimeState.time_scale = 1.0, expires_tick = 0, у всех сущностей
  с TimeSlowImmune снимается иммунитет.

fields:
  expires_tick: u64    # Тик окончания эффекта, 0 = эффект не активен
