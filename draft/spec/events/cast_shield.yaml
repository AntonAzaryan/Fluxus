# Команда каста щита
# Генерируется PlayerCommandIngestSystem, потребляется ShieldCastSystem

name: CastShield
description: |
  Команда каста способности «Щит» (клавиша E).
  Генерируется PlayerCommandIngestSystem из InputBuffer.
  
  ShieldCastSystem читает CastShield, проверяет кулдаун и отсутствие активного щита,
  создаёт сущность щита перед персонажем в направлении прицеливания.
  
  Щит — отдельная сущность с коллайдером, следует за персонажем (в MVP стационарен после каста).
  Направление: target_x, target_y — мировые координаты точки клика мыши.

fields:
  tick: u64           # Тик отправки команды (для валидации)
  player_id: u64      # entity_id игрока
  caster_id: u64      # entity_id кастера (обычно = player_id)
  target_x: fixed     # Мировая X координата точки прицеливания (задаёт направление)
  target_y: fixed     # Мировая Y координата точки прицеливания
  target_z: fixed     # Мировая Z координата точки прицеливания
