# Снаряд (фаербол)
# Маркер-компонент для идентификации снарядов

name: Projectile
description: |
  Маркер-компонент для снарядов (фаерболы и т.п.).
  Содержит информацию о владельце для подсчёта урона и дружественного огня.
  
  ProjectileHitSystem читает Projectile при коллизии и наносит урон цели.

fields:
  owner_id: u64       # entity_id кастера (для подсчёта урона)
  damage: fixed       # Урон снаряда
  max_distance: fixed # Максимальное расстояние полёта
  traveled_distance: fixed # Пройденное расстояние (накапливается ProjectileTravelSystem, деспавн при >= max_distance)
