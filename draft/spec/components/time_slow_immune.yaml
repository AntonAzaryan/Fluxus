# Иммунитет к замедлению времени
# Маркер-компонент для игнорирования эффекта TimeSlow

name: TimeSlowImmune
description: |
  Маркер-компонент, указывающий на иммунитет к замедлению времени.
  Сущности с этим компонентом не получают глобальный time_scale эффект.
  
  Применяется к:
  - Кастеру замедления времени (на время действия способности)
  - Снарядам, выпущенным кастером во время действия способности
  
  Система TimeSlowSyncSystem читает этот маркер и устанавливает LocalTimeScale

fields: {}
