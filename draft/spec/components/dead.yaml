# Смерть сущности
# Маркер-компонент для умерших сущностей, ожидающих респавна

name: Dead
description: |
  Маркер-компонент, указывающий что сущность мертва и ожидает респавна.
  Добавляется ProjectileHitSystem или DamageApplicationSystem при health <= 0.
  
  Пока есть Dead:
  - Сущность не двигается и не действует
  - Игрок не может управлять ею
  - RespawnSystem отсчитывает время до возрождения
  
  При респавне Dead удаляется, Health восстанавливается, Cooldowns сбрасываются.

fields:
  respawn_tick: u64    # Тик, в котором произойдёт респавн
