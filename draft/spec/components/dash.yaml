# Состояние рывка
# См. schedule.yaml — DashStartSystem, DashUpdateSystem

name: Dash
description: |
  Компонент активного рывка. Добавляется при начале рывка,
  удаляется после завершения (dash_duration_ms).
  
  Пока есть Dash, сущность двигается с повышенной скоростью (dash_speed)
  в направлении, заданном при старте рывка.

fields:
  start_tick: u64     # Тик начала рывка
  duration_ms: fixed  # Длительность рывка (мс)
  dir_x: fixed        # Направление рывка по X (нормализовано)
  dir_y: fixed        # Направление рывка по Y (нормализовано)
  dir_z: fixed        # Направление рывка по Z (нормализовано)
