# Скорость сущности
# См. physics_v1.md §2 — входные компоненты для динамического тела

name: Velocity
description: |
  Вектор скорости сущности (единиц/сек).
  Изменяется системами движения (MovementSystem, DashUpdateSystem) и провайдером физики.
  Провайдер физики использует Velocity для интеграции позиции.

fields:
  dx: fixed    # Скорость по оси X (единиц/сек)
  dy: fixed    # Скорость по оси Y (единиц/сек)
  dz: fixed    # Скорость по оси Z (единиц/сек), обычно 0 в MVP
