# Слой коллизий
# См. physics_v1.md §2 — опциональные компоненты

name: CollisionLayer
description: |
  Битовая маска слоя коллизий и маска взаимодействия.
  Используется провайдером физики для определения, какие тела сталкиваются.
  
  layer: битовая маска слоя, к которому принадлежит тело.
  mask:  битовая маска слоёв, с которыми это тело сталкивается.
  
  Пример для игрока (layer=1, mask=0b1110):
  - Столкнётся со стенами (2), щитами (4), снарядами (8)
  - Не столкнётся с другими игроками (1) — для MVP без дружественного огня
  
  Слои в MVP:
  - 1 (0b0001): Игроки
  - 2 (0b0010): Стены
  - 4 (0b0100): Щиты
  - 8 (0b1000): Снаряды

fields:
  layer: u32    # Битовая маска слоя тела
  mask: u32     # Битовая маска слоёв для коллизий
