# Коллайдер сущности
# См. physics_v1.md §2 — входные компоненты

name: Collider
description: |
  Физический коллайдер сущности. Определяет форму и размеры для коллизий.
  В MVP поддерживаются только круги (radius) и AABB (half_width, half_height).
  
  Для круга: shape = "circle", radius > 0, half_width/half_height игнорируются.
  Для прямоугольника: shape = "aabb", half_width/half_height > 0, radius игнорируется.

fields:
  shape: string         # "circle" или "aabb"
  radius: fixed         # Радиус для круга, 0 для AABB
  half_width: fixed     # Половина ширины для AABB, 0 для круга
  half_height: fixed    # Половина высоты для AABB, 0 для круга
  height: fixed         # Высота по Z (для проверки пересечения в 2.5D)
