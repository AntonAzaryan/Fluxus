# Ограниченное время жизни сущности
# См. schedule.yaml — ShieldExpirationSystem

name: Lifetime
description: |
  Момент истечения существования сущности, заданный номером тика,
  а не миллисекундами — целочисленное сравнение тиков исключает
  рассинхрон от конвертации мс↔тик между разными системами.

  Система, отвечающая за конкретную сущность (например,
  ShieldExpirationSystem для щита), обязана сама сравнивать
  TimeState.current_tick с Lifetime.expires_tick и уничтожать
  сущность по достижении.

fields:
  expires_tick: u64    # Тик, на котором сущность должна быть уничтожена
