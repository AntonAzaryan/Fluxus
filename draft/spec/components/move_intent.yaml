# Намерение движения от игрока
# См. schedule.yaml — стадия Intent, MoveIntentSystem

name: MoveIntent
description: |
  Намерение движения от игрока (сырые инпуты WASD).
  MoveIntentSystem читает InputBuffer и записывает MoveIntent.
  MovementSystem читает MoveIntent и устанавливает Velocity.
  
  Компонент очищается в конце каждого тика.

fields:
  dx: fixed    # Намерение движения по X (-1.0 .. 1.0, нормализовано)
  dy: fixed    # Намерение движения по Y (-1.0 .. 1.0, нормализовано)
  dz: fixed    # Намерение движения по Z (в MVP всегда 0 — арена плоская)
