schema: spec-driven

context: |
  Движок сетевой 2.5D PvP-арены (Warlocks-like, до 10 игроков, изометрия).
  Продуктовый контекст — docs/one-pager.md в корне репозитория, архитектурный обзор
  и roadmap — docs/architecture.md там же.

  Стек: TypeScript (ядро MVP), собственное SoA-хранилище на TypedArray,
  JsonLogic-совместимый JSON-AST со своим evaluator'ом (выражения),
  MessagePack (рантайм-снапшоты), Kotlin + Compose Multiplatform (редактор).
  Задел на вторую реализацию ядра на Rust. Никакого WASM в MVP.

  Неснимаемые принципы (нарушение = дефект, а не компромисс):
  - Детерминизм first-class: единственный вход в симуляцию — tick(state, inputs) → TickResult.
  - Fixed-point Q16.16 везде в симуляции; float в геймплейных расчётах запрещён.
  - Data-driven: системы и геймплей описываются JSON, ядро — универсальный evaluator.
  - Единый интерфейс System: JSON-система и нативная TS-система взаимозаменяемы за одним
    контрактом, переписывание в код ради скорости не меняет ничего вокруг.
  - Мутации ECS только через Command Buffer; никаких side-channel API вне тика.
  - Наблюдаемость без side-effect'ов: симуляция ничего не отправляет наружу,
    внешние потребители читают TickResult после тика.
  - Server-authoritative netcode; каждому клиенту уходит снапшот, отфильтрованный
    по видимости (FoW — часть симуляции, а не рендера, иначе wallhack).

  Язык документации — русский; модальность требований (SHALL / MUST NOT) — английская,
  этого требует валидатор OpenSpec.

  Требования пронумерованы историческими ID (DET-1, NET-15, FOW-4 …) — они сохранены
  в заголовках Requirement, потому что на них ссылаются внутренние
  перекрёстные ссылки в спеках. Новое требование получает следующий свободный номер
  в своём префиксе.

  Реализация ядра — engine/core-ts (TypeScript), рабочий код с тестами и golden-сценариями
  в engine/tests/golden/. Источником правды о том, каким движок должен быть, остаётся
  спека (CORE-3): при расхождении реализации и спеки дефект — в реализации, а не в спеке.

rules:
  specs:
    - 'Сохраняй исторический ID в заголовке требования, формат: "### Requirement: DET-1 Название"'
    - Текст требования на русском, модальность словами SHALL / MUST NOT
    - Не дублируй требование в двух capability — ссылайся на соседнюю спеку по имени
  design:
    - Явно указывай, что механизм (core), а что политика (геймплейная система в evaluator)
