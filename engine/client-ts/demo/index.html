<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>render-ts демо — террейн, герой, фаербол</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
      }
      #app,
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        color: #e8e8f0;
        font: 13px/1.5 ui-monospace, Menlo, monospace;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        pointer-events: none;
        user-select: none;
      }
      #hud b {
        color: #ffd479;
      }
      #hud-status {
        margin-top: 6px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div><b>WASD / стрелки</b> — движение &nbsp; <b>Shift</b> — уклон (дважды — перекат) &nbsp; <b>Space</b> — прыжок</div>
      <div><b>ЛКМ</b> — фаербол в точку клика (взрыв выбивает пол)</div>
      <div><b>T</b> — скин steel/ember &nbsp; <b>K</b> — смерть героя</div>
      <div id="hud-status">запуск…</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
