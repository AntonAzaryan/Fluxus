<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>render-ts демо — террейн, герой, фаербол</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
      }
      /* Контейнер вьюпорта — опора оверлея HUD (host.ts: absolute, inset 0). */
      #app {
        position: relative;
      }
      #app,
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Минимальная нейтральная стилизация виджетов HUD (design, Non-Goals):
         раскладку зон и прохождение указателя задаёт сам оверлей-хост
         инлайн-стилями, здесь — только внешний вид демо. */
      [data-hud-root] {
        font: 13px/1.5 ui-monospace, Menlo, monospace;
        color: #e8e8f0;
        user-select: none;
      }
      .hud-match-status {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 12px;
        padding: 8px 12px;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
      }
      .hud-match-status__tick::before {
        content: 'тик ';
        opacity: 0.6;
      }
      .hud-match-status.is-paused {
        border-color: #ffd479;
      }
      .hud-match-status.is-paused .hud-match-status__mode {
        color: #ffd479;
      }
      .hud-match-status__pause,
      .hud-ability-bar__button {
        font: inherit;
        color: inherit;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 6px;
        cursor: pointer;
      }
      .hud-match-status__pause:active,
      .hud-ability-bar__button:active {
        border-color: #ffd479;
      }
      .hud-ability-bar {
        display: flex;
        gap: 8px;
        margin: 12px;
      }
      .hud-ability-bar__button {
        width: 52px;
        height: 52px;
        padding: 8px;
        border-radius: 10px;
      }
      .hud-ability-bar__icon {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hud-minimap {
        margin: 12px;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        overflow: hidden;
      }
      .hud-portrait {
        margin: 12px;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        overflow: hidden;
      }
      .hud-portrait--dead {
        filter: grayscale(1);
      }
      .hud-portrait--hit {
        border-color: #ff5a4a;
      }
      .hud-portrait--empty {
        opacity: 0.6;
      }
      /* Клавиатурная справка демо: статична и прозрачна для указателя —
         с HUD-3 не конфликтует, событий не перехватывает. */
      #help {
        position: fixed;
        top: 12px;
        right: 12px;
        padding: 10px 14px;
        color: #e8e8f0;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        pointer-events: none;
        user-select: none;
      }
      #help b {
        color: #ffd479;
      }
      /* Кнопка подключения к стенду (design D4): DOM демо-приложения, а не
         виджет HUD — это переход между режимами страницы, то есть новый старт
         оболочки (SHELL-8), а не действие внутри матча. */
      #connect {
        position: fixed;
        right: 12px;
        bottom: 12px;
        padding: 6px 10px;
        color: #e8e8f0;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        text-decoration: none;
        background: rgba(10, 10, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        z-index: 20;
      }
      #connect:hover {
        border-color: #ffd479;
      }
      /* Сообщение сборки: матч занят, стенд не отвечает. Скрыто, пока нечего
         сказать; текст ставит main.ts. */
      #notice {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        max-width: 60ch;
        transform: translate(-50%, -50%);
        padding: 14px 18px;
        color: #ffd479;
        font: 13px/1.6 ui-monospace, Menlo, monospace;
        text-align: center;
        background: rgba(10, 10, 24, 0.9);
        border: 1px solid #ffd479;
        border-radius: 10px;
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="help">
      <div><b>WASD / стрелки</b> — движение &nbsp; <b>Shift</b> — уклон (дважды — перекат) &nbsp; <b>Space</b> — прыжок</div>
      <div><b>ЛКМ</b> — фаербол в точку клика (взрыв выбивает пол); шаг в дыру — смерть</div>
      <div><b>T</b> — скин steel/ember &nbsp; <b>K</b> — смерть героя</div>
      <div><b>C</b> — центр на герое &nbsp; <b>Y</b> — follow &nbsp; <b>F</b> — облёт &nbsp; край экрана — панорама</div>
    </div>
    <div id="notice"></div>
    <a id="connect" href="#">играть по сети →</a>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
